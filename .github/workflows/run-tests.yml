name: continuous-testing
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./scraper/requirements.txt
          pip install -r ./shared/requirements.txt
      - name: Set up environment
        run: |
          echo "PROFILER_PATH=${{ github.workspace }}/data/profiler.prof" >> $GITHUB_ENV
          echo "LOG_PATH=${{ github.workspace }}/data/scraper.log" >> $GITHUB_ENV
          echo "DB_PATH=${{ github.workspace }}/data/test.db" >> $GITHUB_ENV
          echo "DUMP_PATH=${{ github.workspace }}/data/dump.sql" >> $GITHUB_ENV
          mkdir -p data/profiler data/logs data/dumps
      - name: Test with pytest
        run: |
          pip install pytest pytest-cov
          pytest --junitxml=junit/test-results.xml --cov=scraper --cov-report=html
      - name: Upload test results
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            junit/
            htmlcov/