services:
  scraper:
    env_file: 
      - .env
    environment:
      - CONNECTION_ISSUES_SLEEP=60
      - RATE_LIMIT_SLEEP=180
      - MIN_SLEEP=5
      - MAX_SLEEP=1200
      - MAX_USERS=30
      - MIN_ENTRIES=1
    build:
      context: .
      dockerfile: ./scraper/Dockerfile
    volumes:
      - ./data:/app/data
      - ./log:/app/log
      - ./shared:/app/shared
    stop_grace_period: 20s
  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    env_file: 
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT}/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      - ./data:/app/data
      - ./shared:/app/shared
    restart: unless-stopped
  ui:
    build:
      context: .
      dockerfile: ./ui/Dockerfile
    ports:
      - "${UI_PORT}:${UI_PORT}"
    env_file: 
      - .env
    volumes:
      - ./shared:/app/shared
    restart: unless-stopped
    